[project]
name = "kblam"
version = "0.1.0"
description = "Current-facts knowledge base validator and writer for LLM research agents"
authors = [
    { name = "hungryboygeorge", email = "hungryboygeorge@gmail.com" }
]
license = "LicenseRef-VibeCoded-AI-Slop-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "ruamel-yaml>=0.19.1",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
kblam = "kblam.entry:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
